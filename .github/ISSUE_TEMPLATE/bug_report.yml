name: Bug Report
description: Report a layout, build, or runtime bug
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local dev (Fedora)
        - Cloudflare Preview (PR)
        - Production (main)
