# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
  path_instructions:
    - path: 'src/**/*.svelte'
      instructions: 'Review for Svelte 5 runes ($state, $derived, $effect, $props), semantic HTML, accessibility (alt tags, ARIA, keyboard navigation), and Tailwind CSS v4 dark/light mode contrast.'
    - path: '**/*.md'
      instructions: 'Check Markdown frontmatter structure, valid Mermaid diagram syntax, and clear technical writing.'
chat:
  auto_reply: true
